<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆设置 v5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#C4F0DA; --card:#FFFDF8; --ink:#1F2421; --sub:#8E9590; --line:#EEF0EC;
  --mint:#8EBD9F; --off:#D3D7D4; --red:#D16F68; --id:#A3ABA6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow-x:hidden}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink)}
.wrap{width:100%;max-width:390px;margin:0 auto;padding:10px 14px 60px}
h1{font-size:19px;font-weight:600;text-align:center;margin:12px 0 4px}
.note{font-size:12px;color:#4F6B5B;text-align:center;margin:0 0 14px;line-height:1.5}
.sec{margin-bottom:16px}
.st{font-size:14px;color:#5D7266;margin:0 6px 7px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card);min-width:0}
.card>.row:first-child,.list>.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.g{cursor:grab;color:#C9CECA;font-size:14px;user-select:none;touch-action:none;flex:none}
.x{flex:1;min-width:0}
.t{font-size:15.5px;line-height:1.3}
.t .id{font-size:11px;color:var(--id);margin-right:6px;font-variant-numeric:tabular-nums}
.s{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.4}
.s.red{color:var(--red)}
.dim .t,.dim .s{color:#B9BFBB}
.sw{width:48px;height:29px;border-radius:15px;background:var(--off);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0002;transition:.12s}
.sw.on{background:var(--mint)}.sw.on::after{left:21.5px}
.ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #C9CECA;flex:none;position:relative;cursor:pointer}
.ck.on{background:var(--mint);border-color:var(--mint)}
.ck.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.c{color:#C9CECA;flex:none;font-size:17px}
.tagx{font-size:11px;color:var(--sub);background:#F0F2EF;border-radius:7px;padding:2px 7px;flex:none}
.pill{font-size:13px;background:#EFF1EE;border-radius:8px;padding:4px 9px;flex:none}
.slider{padding:0 14px 12px}
.slider input{width:100%;accent-color:var(--mint);margin:2px 0}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.ticks b{color:var(--ink)}
.cxline{font-size:12px;color:#5D7266;margin-top:6px;line-height:1.45}
.status{padding:14px 44px 14px 18px;position:relative}
.sl{font-size:13.5px;color:var(--sub);line-height:1.85;cursor:pointer}
.sl.bad{color:var(--red)}
.sl .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:2px}
.info{position:absolute;top:12px;right:14px;width:22px;height:22px;border-radius:50%;border:1.5px solid #9DB5A6;color:#6E8F7B;font-size:13px;font-style:italic;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:Georgia,serif}
.log{padding:10px 14px;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log .lt{font-size:14.5px}
.log .ls{font-size:12px;color:var(--sub);margin-top:2px}
.log.bad .lt{color:var(--red)}
.log.hl{background:#EAF6EE}
.day{font-size:13px;color:#5D7266;margin:14px 8px 6px}
.ghost{opacity:.35}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:5}
.sheet.show{display:block}
.nav{display:flex;align-items:center;padding:14px 4px 8px;font-size:15px}
.nav .back{color:#4F7D60;cursor:pointer;min-width:64px}
.nav .ttl{flex:1;text-align:center;font-weight:600}
.nav .sp{min-width:64px}
.step{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.step span{display:block;width:32px;text-align:center;line-height:28px;background:#F7F8F6;cursor:pointer;font-size:16px}
.step span+span{border-left:1px solid var(--line)}
.bline{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#5D6862;margin-top:10px}
.bline.small{font-size:12px;color:var(--sub);margin-top:4px}
.num{width:96px;text-align:right;font:14px ui-monospace,Menlo,monospace;border:0;border-radius:7px;background:#EFF1EE;padding:5px 8px;color:var(--ink)}
.mono{font:14px ui-monospace,Menlo,monospace;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:#EEF1EE;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}
.link{color:#4F7D60;cursor:pointer}
.seg{display:flex;background:#EEF1EE;border-radius:9px;padding:2px;margin:4px 0}
.seg span{flex:1;text-align:center;font-size:12.5px;padding:6px 0;border-radius:7px;color:var(--sub);cursor:pointer}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px #0001}
.chip{font-size:11px;border-radius:9px;padding:2px 8px;flex:none}
.chip.open{background:#DCEFE3;color:#3F7353}.chip.faded{background:#F0F2EF;color:var(--sub)}.chip.done{background:#F0F2EF;color:#B9BFBB;text-decoration:line-through}
.foot{font-size:12px;color:#5D7266;margin:6px 8px 0;line-height:1.5}
.tools{display:flex;justify-content:center;margin-top:8px}
.tools button{border:0;border-radius:15px;padding:7px 14px;background:var(--card);font-size:12.5px;cursor:pointer;color:var(--ink)}
#out{display:none;white-space:pre-wrap;background:var(--card);border-radius:14px;padding:12px;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>记忆</h1>
  <div class="note">小样：按住 ≡ 拖整组或单行排顺序（app 里不做拖动）<br>带 › 的行点开看二级页</div>

  <!-- 状态卡：不参与拖 -->
  <div class="sec"><div class="card status" id="status"></div></div>

  <div id="secs"></div>

  <div class="tools"><button id="copy">复制我排好的顺序</button></div>
  <div id="out"></div>
</div>

<div class="sheet" id="sheet"><div class="wrap" id="sheetBody"></div></div>

<script>
const AI = '狗狗';
const state = {
  master:true, cx:2,
  on:{A2:true,A3:true,A4:true,B1:true,B3:false,B4:true,C2:true},
  win:{A2:true,A3:true,A4:true,P:true,B4:true,C:true},
};
// 复杂度：每一档开哪些（顶 = 全开）
const LEVELS = [
  {name:'0', on:[]},
  {name:'轻', on:['A2','A4']},
  {name:'中', on:['A2','A3','A4','B4','C2']},
  {name:'重', on:['A2','A3','A4','B1','B4','C2']},
];
const WRITERS = [
  {id:'A2', t:'上下文摘要', s:'挤出视野的一段段记下', m:'sonnet-4-6'},
  {id:'A3', t:'窗口总结', s:'一个窗口再压成约 300 字', m:'sonnet-4-6'},
  {id:'A4', t:'时间轴', s:'每个窗口每天一条', m:'sonnet-4-6'},
  {id:'B1', t:'心声', s:AI+'聊到触动处写独白', m:'对话模型'},
  {id:'B2', t:AI+'日记', todo:true},
  {id:'B3', t:'做梦', todo:true},
  {id:'B4', t:AI+'的记忆', s:AI+'自己记、改、划掉的', m:'对话模型'},
  {id:'C',  t:'档案', s:'关键词 + 原文 · 412 条', view:true},
  {id:'C2', t:'碎片池', s:'小模型填表，格式不对不收', m:'本机'},
  {id:'C3', t:'整理编目', todo:true},
];
// 粟粟 10-15 拖好的顺序
const INIT = [
  {id:'top', title:'', rows:['master','start','startday','model','budget','cx']},
  {id:'write', title:'写入 · 记什么', rows:WRITERS.map(w=>'w:'+w.id)},
  {id:'tidy', title:'整理 · 怎么管', rows:['pending','tidy','deleted']},
  {id:'inject', title:'注入 · 塞什么进 prompt', rows:['winpage','catalog','recallui','feedback','ibudget']},
  {id:'search', title:'检索 · 怎么挑记忆', rows:['all','kw','sem','assoc','hist']},
];
let layout; try{layout=JSON.parse(localStorage.getItem('mp-mem-v5d'))}catch(e){}
if(!layout||!layout.length) layout=JSON.parse(JSON.stringify(INIT));
const save=()=>{try{localStorage.setItem('mp-mem-v5d',JSON.stringify(layout))}catch(e){}};
state.bper = '周'; state.bamt = 3;
const BSPENT = {'周':'$1.20','日':'$0.31'};
// 记忆 log：每次写记忆一条
const LOG = [
  {id:'l1', day:'今天', time:'14:02', w:'A4', t:'时间轴', ok:false, note:'请求超时', m:'sonnet-4-6'},
  {id:'l2', day:'今天', time:'13:48', w:'A2', t:'上下文摘要', ok:true, note:'第 3 段 · 《看病》', m:'sonnet-4-6', cost:'$0.04'},
  {id:'l3', day:'今天', time:'13:26', w:'A3', t:'窗口总结', ok:true, note:'《搬家》286 字', m:'sonnet-4-6', cost:'$0.03'},
  {id:'l4', day:'今天', time:'11:10', w:'A4', t:'时间轴', ok:false, note:'请求超时', m:'sonnet-4-6'},
  {id:'l5', day:'今天', time:'09:55', w:'A4', t:'时间轴', ok:false, note:'请求超时', m:'sonnet-4-6'},
  {id:'l6', day:'10-11', time:'22:31', w:'C2', t:'碎片池', ok:true, note:'记下 4 条 · 拒收 1 条（格式不对）', m:'本机'},
];

const W = id => WRITERS.find(w=>w.id===id);
const sw = (on,attr) => `<div class="sw ${on?'on':''}" ${attr}></div>`;
const ck = (on,attr) => `<div class="ck ${on?'on':''}" ${attr}></div>`;
const g = '<span class="g">≡</span>';

function rowHTML(key){
  const R=(t,s,right,tap,extra='')=>`<div class="row ${tap?'tap':''}" data-k="${key}" ${tap?`data-open="${tap}"`:''} ${extra}>${g}<div class="x"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div>${right}</div>`;
  if(key==='master') return R('记忆系统总开关','关 = 不注入、不提取；数据不动', sw(state.master,'data-act="master"'));
  if(key==='start') return R('记忆从哪天开始','这天以前的聊天不写', sw(true,''));
  if(key==='startday') return R('从这天开始','', '<span class="pill">2026年9月24日</span>');
  if(key==='budget'){
    const off = state.bper==='关闭';
    const seg = `<div class="seg" style="margin:8px 0 0 24px">${['关闭','周','日'].map(p=>`<span class="${state.bper===p?'on':''}" data-act="bper:${p}">${p}</span>`).join('')}</div>`;
    if(off) return `<div class="row" data-k="budget" style="display:block"><div style="display:flex;gap:10px;align-items:center">${g}<div class="x"><div class="t">写入预算</div><div class="s">不限</div></div></div>${seg}</div>`;
    const spent = state.bper==='周'?1.20:0.31, pct=Math.min(100,Math.round(spent/state.bamt*100));
    return `<div class="row" data-k="budget" style="display:block"><div style="display:flex;gap:10px;align-items:center">${g}<div class="x"><div class="t">写入预算</div><div class="s">后台写记忆的钱，超了就停</div></div></div>${seg}
      <div style="margin-left:24px">
        <div class="bline"><span>预算（USD）</span><input class="num" type="text" inputmode="decimal" value="${state.bamt.toFixed(2)}" data-act="bamt"></div>
        <div class="bline"><span>这${state.bper==='周'?'周':'天'}已用</span><span class="mono">$ ${spent.toFixed(4)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="bline small"><span>${pct}%</span><span class="link">重置已用</span></div>
      </div></div>`;
  }
  if(key==='cx'){
    const lv=matched(); const L=lv<0?null:LEVELS[lv];
    const names=['0','轻','中','重'].map((n,i)=>i===lv?`<b>${n}</b>`:n).join('</span><span>');
    const onIds=WRITERS.filter(w=>!w.todo&&!w.view&&state.on[w.id]).map(w=>w.id+' '+w.t);
    return `<div class="row" data-k="cx" style="display:block;padding-bottom:4px"><div style="display:flex;gap:10px;align-items:center">${g}<div class="x"><div class="t">复杂度</div></div>${lv<0?'<span class="tagx">自定义</span>':''}</div></div>
      <div class="slider" data-k="cx-s"><input type="range" min="0" max="3" step="1" value="${lv<0?state.cx:lv}" data-act="cx">
      <div class="ticks"><span>${names}</span></div>
      <div class="cxline">开着：${onIds.length?onIds.join('、'):'都关着'}</div></div>`;
  }
  if(key.startsWith('w:')){
    const w=W(key.slice(2));
    if(w.todo) return `<div class="row dim" data-k="${key}">${g}<div class="x"><div class="t"><span class="id">${w.id}</span>${w.t}</div><div class="s">还没做</div></div></div>`;
    if(w.view) return R(`<span class="id">${w.id}</span>${w.t}`, w.s, '<span class="c">›</span>', 'C');
    const fail = w.id==='A4' && state.on.A4;
    return R(`<span class="id">${w.id}</span>${w.t}`, fail?`<span class="s red" style="margin:0">连续 3 次没写成 ›</span>`:`${w.s} · ${w.m}`, sw(state.on[w.id],`data-act="on:${w.id}"`)+'<span class="c">›</span>', w.id);
  }
  if(key==='model') return R('提取模型','没单独选的都用它 · sonnet-4-6','<span class="c">›</span>','model');
  if(key==='portrait') return R(AI+'眼里的你','画像：看、改、重写','<span class="c">›</span>','portrait');
  if(key==='pending') return R('待续','没做完 3 · 淡了 1','<span class="c">›</span>','pending');
  if(key==='tidy') return R('整理记忆…','','<span class="c">›</span>','tidy');
  if(key==='deleted') return R('已删除','9 条','<span class="c">›</span>','deleted');
  const WIN={ 'win:A2':['上下文摘要','最近 2 段带全文','A2'], 'win:A3':['窗口总结','','A3'], 'win:A4':['时间轴','8 条 · 往回 7 天','A4'],
    'win:P':['↳ 没做完的待续','跟在时间轴后面','P'], 'win:B3':['画像','','B3'], 'win:B4':[AI+'的记忆','最近 5 条带全文','B4'], 'win:C':['档案','按下面「检索」挑','C'] };
  if(WIN[key]){ const [t,s,id]=WIN[key]; const k=key.slice(4); const lab=id==='P'?'':`<span class="id">${id}</span>`;
    return R(lab+t, s, ck(state.win[k],`data-act="win:${k}"`)); }
  if(key==='winpage'){ const n=Object.values(state.win).filter(Boolean).length;
    return R('开窗口带什么',`新开窗口时带进去的 · 勾了 ${n} 项`,'<span class="c">›</span>','win'); }
  if(key==='catalog') return R('目录式注入','命中的只带一行目录', sw(false,''));
  if(key==='recallui') return R('想起来了','行内', '<span class="c">›</span>','recallui');
  if(key==='feedback') return R('召回反馈','卡片上点赞点踩', sw(true,''));
  if(key==='ibudget') return R('注入预算','10000 token', '<span class="c">›</span>','ibudget');
  const S={all:['全量注入','不筛选',true],kw:['关键词命中','聊到关键词才带',false],sem:['按意思找记忆','意思相近也能想起',false],assoc:['关联扩展','顺带关联的记忆',false],hist:['对话历史搜索',AI+'能搜旧对话原话',true]};
  if(S[key]) return R(S[key][0],S[key][1],sw(S[key][2],''));
  return '';
}
function matched(){
  for(let i=LEVELS.length-1;i>=0;i--){
    const ok=WRITERS.filter(w=>!w.todo&&!w.view).every(w=>!!state.on[w.id]===LEVELS[i].on.includes(w.id));
    if(ok) return i;
  } return -1;
}
function renderStatus(){
  const el=document.getElementById('status');
  const info = `<span class="info" data-log="">i</span>`;
  if(!state.master){ el.innerHTML=`${info}<div class="sl">总开关关着 · 都暂停了</div>`; return; }
  el.innerHTML = info + [
    ['上次记新东西：4 天前','l6',false],['上次写上下文摘要：12 分钟前','l2',false],['上次写窗口总结：34 分钟前','l3',false],
    ['最近写不成时间轴：连续 3 次','l1',true],
  ].map(([t,l,bad])=>`<div class="sl ${bad?'bad':''}" data-log="${l}">${bad?'<i class="dot"></i>':''}${t}</div>`).join('');
}
function render(){
  renderStatus();
  const root=document.getElementById('secs');
  root.innerHTML=layout.map(s=>`<div class="sec ${(!state.master&&s.id!=='top')?'dim':''}" data-sec="${s.id}">
    ${s.title?`<div class="st"><span class="g">≡</span>${s.title}</div>`:''}
    <div class="card"><div class="list">${s.rows.map(rowHTML).join('')}</div></div></div>`).join('');
  if(window.Sortable){
    new Sortable(root,{handle:'.st .g',draggable:'.sec',animation:150,ghostClass:'ghost',onEnd:sync});
    root.querySelectorAll('.list').forEach(l=>new Sortable(l,{group:'r',handle:'.g',draggable:'[data-k]:not([data-k="cx-s"])',animation:150,ghostClass:'ghost',onEnd:sync}));
  }
}
function sync(){
  const titles={}; layout.forEach(s=>titles[s.id]=s.title);
  layout=[...document.querySelectorAll('#secs .sec')].map(w=>({id:w.dataset.sec,title:titles[w.dataset.sec],
    rows:[...w.querySelectorAll('.list>[data-k]')].map(r=>r.dataset.k).filter(k=>k!=='cx-s')}));
  save(); render();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){ e.stopPropagation(); const v=a.dataset.act;
    if(v==='master') state.master=!state.master;
    else if(v.startsWith('on:')) state.on[v.slice(3)]=!state.on[v.slice(3)];
    else if(v.startsWith('win:')) { state.win[v.slice(4)]=!state.win[v.slice(4)]; render(); openPage('win'); return; }
    else if(v.startsWith('bper:')) state.bper=v.slice(5);
    render(); return; }
  const lg=e.target.closest('[data-log]'); if(lg){ openLog(lg.dataset.log); return; }
  const o=e.target.closest('[data-open]'); if(o && !e.target.closest('.g')) openPage(o.dataset.open);
  if(e.target.closest('[data-back]')) document.getElementById('sheet').classList.remove('show');
});
document.addEventListener('change',e=>{ if(e.target.dataset.act==='bamt'){ const v=parseFloat(e.target.value); if(v>0){state.bamt=v;} render(); }});
document.addEventListener('input',e=>{ if(e.target.dataset.act==='cx'){ const lv=+e.target.value; state.cx=lv;
  WRITERS.forEach(w=>{ if(!w.todo&&!w.view) state.on[w.id]=LEVELS[lv].on.includes(w.id); }); render(); }});

function page(title, body){ return `<div class="nav"><span class="back" data-back>‹ 记忆</span><span class="ttl">${title}</span><span class="sp"></span></div>${body}`; }
const card = rows => `<div class="sec"><div class="card">${rows}</div></div>`;
const row = (t,s,right='') => `<div class="row"><div class="x"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div>${right}</div>`;
const sec = (title,rows) => `<div class="st">${title}</div>${card(rows)}`;
function trigger(){ return `<div class="row" style="display:block"><div class="seg"><span class="on">停 N 分钟</span><span>每 N 回合</span><span>只手动</span></div></div>`+row('窗口停下来多久就写','','<span class="pill">12 小时</span>')+row('新开对话时，先写掉刚聊的','',sw(true,'')); }
function writerPage(id){
  const w=W(id); const fail=id==='A4';
  let b=card(row(`<span class="id">${id}</span>${w.t}`, w.s, sw(state.on[id],''))
    + (fail?row('<span style="color:var(--red)">连续 3 次没写成</span>','原因：请求超时 · 用的 sonnet-4-6 · 今天 14:02（示例）'):row('状态','上次写：12 分钟前')));
  b+=sec('模型', row('用哪个模型', w.m==='对话模型'?'跟对话用同一个（这一项不能单换）':'没单独选就跟「提取模型」', w.m==='对话模型'?'':'<span class="c">›</span>'));
  if(['A2','A3','A4'].includes(id)) b+=sec('什么时候写', trigger()) + `<div class="foot">对话右上 ⋯ 里有「现在写」，点了立刻写这个窗口。</div><div style="height:14px"></div>`;
  if(id==='A2') b+=sec('带多少', row('带全文的最近几段','更早的只带标题','<span class="pill">2 段</span>'));
  if(id==='A4') b+=sec('带多少', row('最多带几条','','<span class="pill">8 条</span>')+row('最多往回看几天','','<span class="pill">7 天</span>')) + sec('待续', `<div class="row tap" data-open="pending"><div class="x"><div class="t">没做完 3 · 淡了 1</div></div><span class="c">›</span></div>`);
  if(id==='B1') b+=sec('显示', row('心声进聊天流','开 = 实时显示；关 = 只落盘', sw(false,'')));
  if(id==='B4') b+=sec('带多少', row('每轮带全文的最近几条','重要度 5 的另算','<span class="pill">5 条</span>')+row('自己主动记的每日上限','','<span class="pill">12 条</span>')+row('最多占注入预算','','<span class="pill">100%</span>')+row('每条正文上限','','<span class="pill">800 字</span>'));
  if(id==='C2') b+=sec('本机模型', row('Qwen 4B','没装 · 没装之前先用提取模型','<span class="pill">下载</span>')) + sec('怎么记', row('提取间隔','','<span class="pill">每 3 轮</span>')+row('提取提示词','','<span class="c">›</span>')+row('本周不收','格式不对被拒 2 次'));
  if(id!=='B1'&&id!=='B4') b+=sec('花费', row('本月','$0.86'));
  return page(`${id} ${w.t}`, b);
}
function openLog(target){
  const days=[...new Set(LOG.map(l=>l.day))];
  const body = days.map(d=>`<div class="day">${d}</div><div class="card">`+LOG.filter(l=>l.day===d).map(l=>
    `<div class="log ${l.ok?'':'bad'} ${l.id===target?'hl':''}" id="${l.id}"><div class="lt">${l.time}　${l.w} ${l.t} · ${l.ok?'写好了':'没写成'}</div>
     <div class="ls">${l.note} · ${l.m}${l.cost?' · '+l.cost:''}</div></div>`).join('')+`</div>`).join('');
  document.getElementById('sheetBody').innerHTML = page('记忆 log', body + `<div class="foot">每次后台写记忆记一条：什么时候、写的哪一项、成没成、原因、用的模型、花了多少。</div>`);
  document.getElementById('sheet').classList.add('show');
  const el = target && document.getElementById(target);
  if(el) el.scrollIntoView({block:'center'}); else window.scrollTo(0,0);
}
function openPage(k){
  let html='';
  if(W(k)&&!W(k).view) html=writerPage(k);
  else if(k==='win') html=page('开窗口带什么', card(['win:A2','win:A3','win:A4','win:P','win:B4','win:C'].map(rowHTML).join('').replace(/<span class="g">≡<\/span>/g,''))
      + `<div class="foot">新开一个窗口时，勾上的这些带进去。聊天过程中按需想起来的，在「检索」里设。</div>`);
  else if(k==='C') html=page('C 档案', card(row('从聊天里记住的','412 条','<span class="c">›</span>')+row('已删除','9 条','<span class="c">›</span>')));
  else if(k==='budget') html=page('写入预算', card(row('本月已花','$3.42')+row('上限','超了后台写手就停','<span class="pill">$5</span>'))+sec('花在哪', row('A2 上下文摘要','$1.20')+row('A3 窗口总结','$0.62')+row('A4 时间轴','$0.86')+row('C2 碎片池','$0.00 · 本机')));
  else if(k==='pending') html=page('待续', `<div class="sec"><div class="card"><div class="row" style="display:block"><div class="seg"><span class="on">没做完 3</span><span>淡了 1</span><span>做完了 4</span></div></div>`
      +[['周三复诊结果要问','《看病》10-14'],['把搬家清单列完','《搬家》10-13'],['答应讲完那个故事','《睡前》10-12']].map(([t,s])=>row(t,s,'<span class="chip open">没做完</span>')).join('')+`</div></div><div class="foot">左滑一条改成「做完了」或「淡了」。${AI}也能自己标。新窗口只带「没做完」的。</div>`);
  else if(k==='model') html=page('提取模型', card(row('自动（默认）','主对话那家有便宜款就用它',ck(false,''))+row('claude-sonnet-4-6','',ck(true,''))));
  else html=page('', card(row('（这一页内容照现在的样子）','')));
  document.getElementById('sheetBody').innerHTML=html;
  document.getElementById('sheet').classList.add('show'); window.scrollTo(0,0);
}
document.getElementById('copy').onclick=async()=>{
  const name=k=>{ if(k.startsWith('w:')){const w=W(k.slice(2));return w.id+' '+w.t;} const el=document.querySelector(`[data-k="${k}"] .t`); return el?el.textContent:k; };
  const txt=layout.map(s=>(s.title||'（最上面）')+'\n'+s.rows.map(k=>'  - '+name(k)).join('\n')).join('\n');
  const o=document.getElementById('out'); o.style.display='block'; o.textContent=txt;
  try{await navigator.clipboard.writeText(txt); o.textContent='已复制，贴给我：\n\n'+txt;}catch(e){}
};
render();
</script>
