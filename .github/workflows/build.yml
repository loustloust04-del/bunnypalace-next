# 干净 clone 编 mac 本体 + iOS 模拟器（不签名、不跑测试）。步骤都在 scripts/ci-build.sh，这里只装工具。
# 只在公开仓（及其公开 fork）跑：私有开发仓的 macOS 分钟按 10 倍计费，且带私人功能，跳过。
# 不用任何 secret；第三方 action 一律钉 commit SHA（注释里是对应 tag）。
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    name: ${{ matrix.platform }}
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [mac, ios]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode
        run: xcodebuild -version

      - name: Tools (xcodegen)
        run: brew install xcodegen

      - name: Tools (iOS sandbox)
        if: matrix.platform == 'ios'
        run: brew install meson ninja llvm lld libarchive

      - name: Tools (bun)
        if: matrix.platform == 'mac'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('MemoryPalace.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: bash scripts/ci-build.sh ${{ matrix.platform }}

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-${{ matrix.platform }}
          path: build/ci-logs/
          if-no-files-found: ignore
