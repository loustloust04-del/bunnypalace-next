# [Bunny] 真机不签名 ipa（用户自备签名工具重签安装）。只在 Bunny 的公开编译镜像里跑。
name: Bunny device ipa

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Release 或 Debug
        default: Release

concurrency:
  group: bunny-device-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    if: github.repository == 'loustloust04-del/bunnypalace-next'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      CI: "true"
      BUNNY_INCREMENTAL: "1"   # 测试包用增量编译模式（仍是 -O 优化），配合 DerivedData 缓存
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Restore file mtimes (for incremental build)
        run: python3 scripts/bunny/restore-mtime.py
      - name: iSH deps key
        id: ishkey
        run: echo "sha=$(git rev-parse HEAD:deps/ish)" >> "$GITHUB_OUTPUT"
      - name: iSH / rootfs cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps/resources/alpine-rootfs.zip
            deps/libs
            build/ish
          key: ish-${{ steps.ishkey.outputs.sha }}-${{ hashFiles('scripts/bootstrap-sandbox.sh', 'scripts/build-ish.sh', 'scripts/prepare-rootfs.sh') }}
      - name: DerivedData cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/bunny/dd
          key: dd-device-${{ github.event.inputs.configuration || 'Release' }}-${{ github.sha }}
          restore-keys: |
            dd-device-${{ github.event.inputs.configuration || 'Release' }}-
      - name: Xcode
        run: xcodebuild -version
      - name: Tools
        run: brew install xcodegen meson ninja llvm lld libarchive
      - name: SwiftPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-device-${{ hashFiles('project.yml') }}
      - name: Build unsigned ipa
        run: scripts/bunny/device-ipa.sh "${{ github.event.inputs.configuration || 'Release' }}"
      - name: Upload ipa
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BunnyPalaceNext-unsigned-ipa
          path: build/bunny/BunnyPalaceNext-unsigned.ipa
          retention-days: 14
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-build-log
          path: build/bunny/*.log
          retention-days: 7
